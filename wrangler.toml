name = "drea-s-online-fashion"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]

main = "./worker.ts"

[assets]
directory = "./build/client"

[[d1_databases]]
binding = "DB"
database_name = "drea_db"
