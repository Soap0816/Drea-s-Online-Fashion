name = "drea-online-fashion"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./build/client"

# --- Database (Cloudflare D1) ---
# Create with: wrangler d1 create drea_db
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "drea_db"
database_id = "cfe3feaf-678a-419b-9b1c-ffd414be571b"

# --- Image storage (Cloudflare R2) ---
# Create with: wrangler r2 bucket create drea-product-images
[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "drea-product-images"

# --- Environment variables (non-secret) ---
[vars]
SITE_URL = "https://dreaonlinefashion.com"

# --- Secrets (set via `wrangler pages secret put NAME`, never committed) ---
# SESSION_SECRET
# ADMIN_INITIAL_PASSWORD_HASH
# RESEND_API_KEY        (optional, for order email notifications)
# DISCORD_WEBHOOK_URL    (optional, for order notifications to Discord — see README)
